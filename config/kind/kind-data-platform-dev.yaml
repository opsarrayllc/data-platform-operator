# Local kind cluster with host 80/443 mapped into the control plane for ingress-nginx.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: data-platform-dev
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
        local-storage-capacity-isolation: "false"
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
