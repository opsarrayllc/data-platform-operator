# Local DataPlatform for kind (embedded MinIO + Postgres + Keycloak, coordinator-only Trino).
#
#   make kind-up      # recreate cluster, ingress, mkcert TLS, CRDs
#   make run          # or: make deploy IMG=...
#   kubectl --context kind-data-platform-dev apply -f config/samples/dataplatform_v1alpha1_local.yaml
#
# Hosts (also printed by kind-up): 127.0.0.1 keycloak.data-platform.local lakekeeper.data-platform.local trino.data-platform.local flink.data-platform.local
# Login user admin; password is in secret keycloak/keycloak-admin.
# DBeaver against Trino: docs/dbeaver.md (OAuth2 + mkcert trust; not username/password).
apiVersion: dataplatform.opsarray.io/v1alpha1
kind: DataPlatform
metadata:
  name: local
spec:
  auth:
    embedded: true
    keycloak:
      namespace: keycloak
      publicURL: https://keycloak.data-platform.local
  authz:
    embedded: true
    openfga:
      namespace: openfga
      postgres:
        storageSize: 1Gi
  storage:
    embedded: true
    minio:
      namespace: minio
      bucket: warehouse
      storageSize: 2Gi
  lakekeeper:
    enabled: true
    namespace: lakekeeper
    publicURL: https://lakekeeper.data-platform.local
    postgres:
      embedded: true
      storageSize: 1Gi
    warehouse:
      name: default
  trino:
    enabled: true
    namespace: trino
    publicURL: https://trino.data-platform.local
    workers: 0
    service:
      type: ClusterIP
  flink:
    enabled: true
    namespace: flink
    publicURL: https://flink.data-platform.local
    taskManagers: 1
    taskSlots: 2
    jobManager:
      processMemory: 1g
    taskManager:
      processMemory: 1g
    service:
      type: ClusterIP
