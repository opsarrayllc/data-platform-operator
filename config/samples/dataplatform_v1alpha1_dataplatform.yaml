apiVersion: dataplatform.opsarray.io/v1alpha1
kind: DataPlatform
metadata:
  labels:
    app.kubernetes.io/name: data-platform-operator
    app.kubernetes.io/managed-by: kustomize
  name: dataplatform-sample
spec:
  # Object storage. MinIO is deployed by default.
  # Set embedded: false and fill s3 to use AWS S3 or another existing store.
  storage:
    embedded: true
    minio:
      # namespace: minio
      # bucket: warehouse
      # storageSize: 20Gi
      # image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
      # mcImage: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    # embedded: false
    # s3:
    #   bucket: my-bucket
    #   region: us-east-1
    #   flavor: aws          # or s3-compat
    #   endpoint: http://minio.minio.svc:9000
    #   pathStyleAccess: true
    #   stsEnabled: false
    #   credentialsSecretRef:
    #     name: s3-credentials
    #     namespace: lakekeeper
  # Identity. Keycloak is deployed by default.
  # Set embedded: false and fill oidc for Okta, JumpCloud, or another IdP.
  # Embedded Keycloak ships groups platform-admins, data-engineers, and analysts.
  # Create a user in Keycloak and add them to a group to grant warehouse access.
  auth:
    embedded: true
    keycloak:
      # namespace: keycloak
      # publicURL: http://localhost:8080
    # embedded: false
    # oidc:
    #   issuer: https://example.okta.com/oauth2/default
    #   audience: lakekeeper
    #   clientID: lakekeeper
    #   tokenEndpoint: https://example.okta.com/oauth2/default/v1/token
    #   scope: lakekeeper
    #   credentialsSecretRef:
    #     name: oidc-credentials
    #     namespace: lakekeeper
  # Authorization. OpenFGA is deployed by default and Trino enforces
  # LakeKeeper permissions through an OPA bridge.
  authz:
    embedded: true
    openfga:
      # namespace: openfga
      # store: lakekeeper
      postgres:
        embedded: true
        # storageSize: 10Gi
    # enabled: false   # use LakeKeeper allowall instead
  # Iceberg REST catalog. Namespace defaults to "lakekeeper".
  # Use a unique namespace if you create more than one DataPlatform.
  lakekeeper:
    enabled: true
    # image: quay.io/lakekeeper/catalog:v0.13.3
    # replicas: 1
    # publicURL: https://lakekeeper.example.com
    postgres:
      embedded: true
      # storageSize: 10Gi
      # To use an existing database instead:
      # embedded: false
      # host: postgres.example.svc
      # port: 5432
      # database: lakekeeper
      # credentialsSecretRef:
      #   name: postgres-credentials
    warehouse:
      name: default
  # Query engine. Namespace defaults to "trino".
  trino:
    enabled: true
    # image: trinodb/trino:476
    # publicURL: https://trino.example.com
    workers: 0
    # extraConfig:
    #   query.max-memory: 1GB
    # extraCatalogs:
    #   tpch: |
    #     connector.name=tpch
    service:
      type: ClusterIP
  # BI dashboards against Trino. Users sign in with Keycloak; SQL runs as the
  # logged-in user via per-user Trino OAuth2 so OPA/LakeKeeper policies apply.
  # The first Trino query may prompt a one-time OAuth consent.
  # When auth.embedded is false, register a confidential "superset" client and
  # put its credentials in the OIDC Secret (supersetClientID / supersetClientSecret).
  # image defaults to data-platform-superset:5.0.0 (authlib + Trino dialect).
  # Build with: make docker-build-superset
  # For a registry: make docker-build-superset SUPERSET_IMG=ghcr.io/org/superset:5.0.0
  #   && docker push ... && set spec.superset.image accordingly.
  # Upstream token forwarding (single login, no second dance) is tracked in
  # https://github.com/apache/superset/pull/38469.
  superset:
    enabled: true
    # image: data-platform-superset:5.0.0
    # publicURL: https://superset.example.com
    postgres:
      embedded: true
      # storageSize: 10Gi
    service:
      type: ClusterIP
