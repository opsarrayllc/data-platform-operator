# DataPlatform with row- and column-level access control in Trino.
#
# LakeKeeper decides who may read a table. Row filters then narrow a readable
# table down to the rows a user is entitled to, and column access hides the
# values of restricted columns unless the user holds a grant.
#
# The operator provisions one OpenFGA store for both. Write the tuples yourself
# against the store id in status.rowFilterStoreID:
#
#   kubectl get dataplatform rowfilters -o jsonpath='{.status.rowFilterStoreID}'
#
#   # alice sees EMEA rows and the ssn column; analysts see US rows
#   curl -sS "$OPENFGA/stores/$STORE/write" \
#     -H "Authorization: Bearer $OPENFGA_API_KEY" \
#     -H 'Content-Type: application/json' \
#     -d '{"writes":{"tuple_keys":[
#           {"user":"user:alice","relation":"viewer","object":"region:emea"},
#           {"user":"group:analysts#member","relation":"viewer","object":"region:us-east"},
#           {"user":"user:alice","relation":"viewer","object":"column:lakekeeper.sales.orders.ssn"}
#         ]}}'
#
# The OPENFGA_API_KEY is in secret openfga/openfga, key apiKey. Tuple users are
# Trino usernames, which is the OIDC `sub` claim (for local Keycloak admin:
# user:00000000-0000-4000-8000-000000000001).
#
# A user with no row-filter grant sees no rows. A user with no column grant
# sees NULL (or the configured mask) in that column. Both fail closed if
# OpenFGA becomes unreachable.
apiVersion: dataplatform.opsarray.io/v1alpha1
kind: DataPlatform
metadata:
  name: rowfilters
spec:
  auth:
    embedded: true
  authz:
    embedded: true
    rowFilters:
      # sales.orders is visible only where region matches a region the user may
      # view: "region:emea" permits rows whose region column is "emea".
      - schema: sales
        table: orders
        column: region
        openfga:
          type: region
          relation: viewer

      # A second filter on the same table is ANDed with the first, so a row must
      # clear both the region and the tenant check.
      - schema: sales
        table: orders
        column: tenant_id
        # An integer column, compared against unquoted literals.
        numeric: true
        openfga:
          type: tenant
          relation: viewer

      # Types and relations are shared freely across tables. Granting
      # "region:emea" once covers every table filtered on that type.
      - schema: sales
        table: invoices
        column: region
        openfga:
          type: region
          relation: auditor

    columnAccess:
      # ssn is visible only to users who hold viewer on this column object.
      # Everyone else sees NULL. The column still appears in the schema.
      - schema: sales
        table: orders
        column: ssn
        openfga:
          type: column
          relation: viewer

      # A short object id shares one grant across tables: "column:email"
      # unmasks email on both orders and invoices.
      - schema: sales
        table: orders
        column: email
        mask: "'***'"
        openfga:
          type: column
          relation: viewer
          object: email
      - schema: sales
        table: invoices
        column: email
        mask: "'***'"
        openfga:
          type: column
          relation: viewer
          object: email
  storage:
    embedded: true
  lakekeeper:
    enabled: true
    warehouse:
      name: default
  trino:
    enabled: true
    workers: 0
