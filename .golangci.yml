version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    # staticcheck panics under Go 1.27 (buildir KeyValueExpr in stdlib poll).
    # Re-enable once honnef.co/go/tools supports this toolchain.
    # - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
        - newexpr
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      - linters:
          - goconst
        path: internal/controller/keycloak.go
      - linters:
          - goconst
        path: internal/controller/catalog.go
      - linters:
          - goconst
        path: internal/controller/lakekeeper.go
      - linters:
          - goconst
        path: internal/controller/trino.go
      - linters:
          - goconst
        path: internal/controller/openfga.go
      - linters:
          - goconst
        path: internal/controller/opa.go
      - linters:
          - goconst
        path: internal/controller/access.go
      - linters:
          - goconst
        path: internal/controller/authzstore.go
      - linters:
          - goconst
        path: .*_test.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
